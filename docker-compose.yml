# Three services on one network: the Spark pipeline, the PostgreSQL it writes to,
# and Adminer (a browser UI for that database).
# The event generator is not a fourth service -- it is a script run inside `spark`
# via `make generate`, because it has no dependency worth its own image.

services:

  postgres:
    # Pinned to 16-alpine deliberately, not the newest major. Verified directly:
    # postgres:18's image moved PGDATA to /var/lib/postgresql/18/docker, so the
    # near-universal `pgdata:/var/lib/postgresql/data` mount below would silently
    # bind a volume onto an unused empty directory and lose the database on every
    # container recreate. 16-alpine keeps the classic path, is supported to Nov
    # 2028, and every feature this project uses (ON CONFLICT, percentile_cont,
    # TIMESTAMPTZ) long predates it.
    # If you ever move to 18+, mount /var/lib/postgresql instead.
    image: postgres:16-alpine
    container_name: rtdi-postgres
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The official image runs every .sql in this directory ONCE, on first
      # initialisation of an empty data dir. Mounting sql/ here makes the
      # postgres_setup.sql deliverable double as the bootstrap -- no "remember
      # to run the setup script" step in the user guide.
      #
      # Mounted as a DIRECTORY, not a single file, on purpose: bind-mounting a
      # path that doesn't exist yet makes Docker create it as a root-owned
      # *directory*, which then silently never runs. sql/ exists from the start
      # of the project, so this works before postgres_setup.sql is written.
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # depends_on alone waits only for the container to START. Postgres takes
      # a few more seconds to accept connections, and Spark would connect into
      # that gap and crash. This is what makes `condition: service_healthy` below
      # mean something. ($$ escapes to a literal $ so the container's shell,
      # not Compose, expands it.)
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  spark:
    build: .
    container_name: rtdi-spark
    env_file: .env
    working_dir: /home/jovyan/work
    volumes:
      - .:/home/jovyan/work
      # Checkpoints go in a NAMED VOLUME, not the bind mount above. Structured
      # Streaming's checkpointing depends on atomic-rename semantics that Windows
      # bind mounts do not reliably honour; the failure mode is rare, silent
      # corruption. A named volume is a real Linux filesystem inside the VM.
      # Inspect it with `make shell` when you need to.
      - checkpoints:/opt/checkpoints
    ports:
      - "8888:8888"   # JupyterLab (token printed by `make logs`)
      - "4040:4040"   # Spark UI -- the streaming query's live progress page
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Adminer: a browser-based SQL client for reading the three tables without
  # needing psql, or a desktop client installed on Windows. Reach it with
  # `make adminer`, which prints a URL with the login form already filled in.
  #
  # It holds no state of its own (it is a single PHP application that opens a
  # connection per request), so it needs no volume and is always safe to drop,
  # recreate, or leave out entirely -- nothing in the pipeline depends on it.
  adminer:
    # Pinned like every other image here, and checked against the registry
    # rather than assumed: 5.5.1 is current.
    #
    # The `-standalone` suffix is load-bearing, not decoration. That variant
    # runs PHP's own built-in web server and therefore serves HTTP directly.
    # The other published variant, `-fastcgi`, speaks only FastCGI and expects
    # an nginx or apache in front of it -- used here it would start cleanly,
    # pass no healthcheck, and serve nothing at all on port 8080.
    image: adminer:5.5.1-standalone
    container_name: rtdi-adminer
    environment:
      # Prefills the login form's "Server" field. This is the one field people
      # get wrong, and for the same reason the README calls out: inside this
      # container `localhost` is Adminer itself, not the database -- the
      # database is `postgres`, the compose service name.
      #
      # Verified directly against 5.5.1 that this variable IS honoured.
      #
      # There is deliberately NO ADMINER_DEFAULT_DRIVER here, even though it
      # is the obvious companion setting and is widely posted as the way to
      # preselect PostgreSQL. Verified directly against 5.5.1: the image
      # ignores it silently -- the "System" dropdown still comes up on
      # MySQL/MariaDB. Setting it would look like it worked and quietly do
      # nothing. The driver is preselected by URL parameter instead
      # (`?pgsql=...`), which was verified to work; see the `adminer` target
      # in the Makefile.
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    # Not a hard requirement -- Adminer only connects when you submit the login
    # form, so it would work fine starting before the database. Gating it on the
    # healthcheck anyway means `make up` never hands you a login page that is
    # guaranteed to fail for the few seconds Postgres is still starting.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  checkpoints:
